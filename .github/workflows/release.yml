name: Release & Publish

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Force publish to npm'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release PR is merged, or manually triggered, publish to npm
      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        run: npm ci

      - name: Build package
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        run: npm run build

      - name: Run tests
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        run: npm test

      - name: Publish to npm with Provenance
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        run: npm publish --provenance --access public
